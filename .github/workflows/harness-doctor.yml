# 하네스 구성 정합성 게이트 (BIOP01-66).
#
# 2단계 도입:
#   1단계(현재) — doctor는 report-only(continue-on-error). 게이트 자체 테스트는 blocking.
#     이유: 스왑 시점에 팬텀 14건이 남아 있어 바로 blocking으로 켜면 모든 PR이 빨간불이 된다.
#     BIOP01-64/71/72가 닫혀 doctor가 green이 되면 2단계로 전환.
#   2단계 — `continue-on-error: true` 를 제거해 blocking 게이트로 승격.
name: harness-doctor
on:
  pull_request:
    branches: [ main, kkkim-pipeline, gglee ]
  push:
    branches: [ gglee ]
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      # 게이트 자체의 검증 — 여기는 처음부터 blocking.
      # 게이트가 틀리면 잘못된 PASS(놓침)·잘못된 FAIL(오검)이 그대로 팀 판단이 된다.
      - name: 게이트 자체 테스트 (harness_doctor 단위·회귀)
        run: python harness_after/tests/test_harness_doctor.py

      # 하네스 구성 검사 — 1단계에서는 report-only.
      - name: 하네스 구성 정합성 검사 (팬텀 역할·경로 drift)
        continue-on-error: true          # ← BIOP01-64/71/72 종료 후 이 줄 삭제 = blocking 승격
        run: python scripts/harness_doctor.py --repo . --manifest harness.yaml
