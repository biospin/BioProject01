# 하네스 구성 정합성 게이트 (BIOP01-66).
#
# 2단계 승격 완료 (2026-07-26).
#   1단계 — doctor는 report-only 였다. 팬텀 14건이 남아 전면 blocking이면 모든 PR이 빨간불이었다.
#   2단계(현재) — BIOP01-64(팬텀 에이전트 0) + BIOP01-71(skills/ 복원)로 팬텀 0 달성 →
#     구성 검사도 blocking. 문서가 실재하지 않는 역할·경로를 가리키면 PR이 막힌다.
name: harness-doctor
on:
  pull_request:
    branches: [ main, kkkim-pipeline, gglee ]
  push:
    branches: [ gglee ]
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      # 게이트 자체의 검증 — 여기는 처음부터 blocking.
      # 게이트가 틀리면 잘못된 PASS(놓침)·잘못된 FAIL(오검)이 그대로 팀 판단이 된다.
      - name: 게이트 자체 테스트 (harness_doctor 단위·회귀)
        run: python harness_after/tests/test_harness_doctor.py

      # 하네스 구성 검사 — 1단계에서는 report-only.
      - name: 하네스 구성 정합성 검사 (팬텀 역할·경로 drift)
        run: python scripts/harness_doctor.py --repo . --manifest harness.yaml
