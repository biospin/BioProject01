# 후보 CI (BIOP01-66). 승인 후 .github/workflows/harness-doctor.yml 로 스왑하면 활성화.
# harness_after/ 안에 두어 지금은 비활성(스왑 전까지 CI 미동작).
name: harness-doctor
on:
  pull_request:
    branches: [ main, kkkim-pipeline ]
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: 하네스 구성 정합성 검사 (팬텀·경로 drift)
        run: python scripts/harness_doctor.py --repo . --manifest harness.yaml
